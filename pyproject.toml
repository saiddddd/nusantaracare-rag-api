[project]
name = "nusantaracare-rag-api"
version = "1.0.0"
description = "Asisten GenAI RAG + Agentic untuk dokumen operasional internal NusantaraCare"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "groq>=0.11",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "chromadb>=0.5",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "Pillow>=10.3",
    "markdown-it-py>=3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "tenacity>=8.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]